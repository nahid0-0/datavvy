services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vms
      POSTGRES_USER: vms
      POSTGRES_PASSWORD: vms
    ports:
      - "5432:5432"
    volumes:
      - vms-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vms -d vms"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/vms
      DB_USERNAME: vms
      DB_PASSWORD: vms
    ports:
      - "8080:8080"

volumes:
  vms-data:
