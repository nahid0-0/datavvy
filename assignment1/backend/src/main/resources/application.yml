spring:
  application:
    name: vms-backend

  # Local secrets (DB_URL, DB_USERNAME, DB_PASSWORD) live in backend/.env, which is git-ignored.
  # Real environment variables take precedence over it.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vms}
    username: ${DB_USERNAME:vms}
    password: ${DB_PASSWORD:vms}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
      # TiDB Cloud's proxy drops idle connections quickly; ping them and recycle well before that.
      keepalive-time: 30000
      idle-timeout: 120000
      max-lifetime: 300000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # schema is owned by Flyway, Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    # {vendor} resolves to mysql (also TiDB), postgresql or h2, so each DB gets a native schema.
    locations: classpath:db/migration/{vendor}

  jackson:
    mapper:
      accept-case-insensitive-enums: true
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-null-for-primitives: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100        # larger requested sizes are capped, not rejected

  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    # Flutter web dev server picks a random port, so allow any localhost port by default.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.starkgroup.vms: INFO
